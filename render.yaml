# Render Blueprint: the React client as a free static site.
# In Render: New + -> Blueprint -> choose this repo -> Apply.
services:
  - type: web
    name: daily-contest
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://daily-contest-api.onrender.com
    routes:
      # Let React Router handle every page, so refreshing /contests does not give 404
      - type: rewrite
        source: /*
        destination: /index.html
