# Render's free plan puts the server to sleep after 15 minutes without requests,
# and the first request after that takes up to a minute.
# This job calls the health check every 10 minutes so the server stays awake.
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the server health check
        run: curl -fsS --max-time 90 https://daily-contest-api.onrender.com/api/health
